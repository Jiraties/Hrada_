<!doctype html>
<html lang="th" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved choice before the stylesheet paints the page.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('hrada-theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta
      name="description"
      content="HRADA — AI Workforce Intelligence สำหรับ SME ไทย: เห็นว่าคนที่มีอยู่เก่งอะไร เหมาะกับงานไหน และควรโตทางไหน"
    />
    <title>HRADA — AI Workforce Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
